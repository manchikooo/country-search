<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страна</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="detail-country" class="container country-mode">
    <section class="country-header">
      <div class="country-info">
        <div class="country-control-buttons">
          <button>Редактировать</button>
        </div>
        <h1 class="title" id="country-name"></h1>
        <div class="params"></div>
      </div>

      <div class="country-flag"></div>
    </section>
    <section class="information">
      <h2 class="subtitle">Подробная информация</h2>
      <table class="table-information">
        <thead>
          <tr>
            <th>Параметр</th>
            <th>Описание</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </div>

  <script src="js/detailCountry.js"></script>
</body>
</html>
